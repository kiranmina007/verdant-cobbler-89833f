<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 65% 50% at 50% 45%, rgba(245, 158, 11, 0.16), transparent 70%),
      radial-gradient(ellipse 50% 40% at 15% 90%, rgba(99, 102, 241, 0.16), transparent 70%),
      #0B0A1F;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 48px 20px;
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- rising data points ---------- */
  .dust { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .dust span {
    position: absolute; bottom: -10px; border-radius: 1px;
    background: #FBBF24;
    box-shadow: 0 0 6px rgba(251, 191, 36, 0.8);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    15%  { opacity: 0.5; }
    85%  { opacity: 0.5; }
    100% { transform: translateY(-105vh); opacity: 0; }
  }

  /* ---------- connecting line (SVG overlay) ---------- */
  #wire { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; overflow: visible; }
  #wire .track { fill: none; stroke: rgba(251, 191, 36, 0.14); stroke-width: 2; stroke-dasharray: 4 8; }
  #wire .live {
    fill: none; stroke: #FBBF24; stroke-width: 3; stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.9));
  }
  #wire .dot {
    fill: #FFFBEB;
    filter: drop-shadow(0 0 8px #FBBF24) drop-shadow(0 0 3px #FFFFFF);
    transition: opacity .2s ease;
  }
  #wire.done .live { animation: flash .5s ease-out; }
  #wire.done .dot { opacity: 0; }
  @keyframes flash {
    0%   { stroke: #FFFBEB; stroke-width: 5; }
    100% { stroke: #FBBF24; stroke-width: 3; }
  }

  /* ---------- content ---------- */
  .head, .join { position: relative; z-index: 1; }
  .head { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .logo {
    flex: 0 0 auto;
    width: clamp(56px, 11vw, 88px);
    height: clamp(56px, 11vw, 88px);
    border-radius: 50%;
    overflow: hidden;
    background: #1E1B3A;
    color: #FBBF24;
    font-size: clamp(18px, 3.6vw, 28px);
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #FBBF24;
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15), 0 0 24px rgba(251, 191, 36, 0.3);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .names { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; }
  h1 {
    margin: 0;
    font-size: clamp(32px, 8vw, 72px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 700;
    letter-spacing: 0;
    padding-right: 0.1em;
    background: linear-gradient(100deg, #FFFFFF 0%, #FEF3C7 50%, #FBBF24 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .alias {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: clamp(13px, 2.4vw, 20px);
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #FBBF24;
  }
  .alias svg { flex: 0 0 auto; }
  .subs {
    font-size: 14px; font-weight: 600; color: #B3AECF;
    display: inline-flex; align-items: center; gap: 6px;
  }

  /* ---------- buttons ---------- */
  .join {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 64px; padding: 0 44px; border-radius: 999px;
    background: linear-gradient(180deg, #FDE68A 0%, #F59E0B 100%);
    color: #2A1A05;
    font-size: 20px; font-weight: 800; text-decoration: none;
    border: 1px solid rgba(254, 243, 199, 0.55);
    box-shadow: 0 10px 30px rgba(245, 158, 11, 0.32);
    overflow: hidden;
    transition: transform .15s ease, filter .15s ease;
  }
  .join:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .join > * { position: relative; z-index: 1; }
  .join::before {
    content: ''; position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sweep { 0% { left: -60%; } 60%, 100% { left: 130%; } }

  .join.send { animation: send .6s ease-out; }
  @keyframes send {
    0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7), 0 10px 30px rgba(245, 158, 11, 0.32); }
    100% { box-shadow: 0 0 0 18px rgba(251, 191, 36, 0), 0 10px 30px rgba(245, 158, 11, 0.32); }
  }

  .join.hit { animation: press .45s cubic-bezier(.3, 1.6, .5, 1); overflow: visible; }
  @keyframes press {
    0%   { transform: scale(1); }
    35%  { transform: scale(0.9); filter: brightness(1.25); }
    100% { transform: scale(1); }
  }
  .join.hit::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    border: 3px solid #FBBF24;
    animation: ring .7s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ring {
    from { transform: scale(1); opacity: 1; }
    to   { transform: scale(1.4, 1.8); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dust, .join::before { display: none; }
  }
</style>

<body>

  <div class="dust" aria-hidden="true">
    <span style="width:3px;height:3px;left:8%;animation-duration:14s;animation-delay:0s"></span>
    <span style="width:2px;height:2px;left:22%;animation-duration:18s;animation-delay:3s"></span>
    <span style="width:4px;height:4px;left:36%;animation-duration:12s;animation-delay:6s"></span>

  <div class="head" id="head">
    <div class="title-row">
      <!-- LOGO: apna logo lagane ke liye "DM" hata ke ye daalo: <img src="https://i.ibb.co/GyNsTRM/logo.png" alt="Diya Malik"> -->

      <!-- SUBS COUNT: yahan apna asli number daalo -->

  <!-- CTA 2 (bottom, auto open at 3s) -->
  <a href="https://t.me/+DloVaaGvt3cxNDM1?start" class="join join-bottom" id="cta-btn" data-tgtrack-cta="1">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 4.5L2.5 11.5l6 2.2 2.3 6.3 3.4-4.1 4.8 3.6z"/><path d="M8.5 13.7l10-7.2"/></svg>
    <span>Join Channel</span>
  </a>

<!-- Design only: line animation only (koi auto-open nahi, koi tracking event nahi) -->
<script>
  (function () {
    var DURATION = 3000;

    var btnTop = document.querySelector('.join-top');
    var btnBottom = document.querySelector('.join-bottom');
    var head = document.getElementById('head');

    var wire = document.getElementById('wire');
    var trackL = document.getElementById('trackL'), trackR = document.getElementById('trackR');
    var liveL = document.getElementById('liveL'),   liveR = document.getElementById('liveR');
    var dotL = document.getElementById('dotL'),     dotR = document.getElementById('dotR');

    var start = null, rafId = null, finished = false, cancelled = false;

    function build() {
      var sx = window.scrollX, sy = window.scrollY;
      var a = btnTop.getBoundingClientRect();
      var b = btnBottom.getBoundingClientRect();
      var h = head.getBoundingClientRect();
      var docW = document.documentElement.clientWidth;
      var docH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);

      wire.setAttribute('width', docW);
      wire.setAttribute('height', docH);

      var gap = 32;
      var xl = Math.max(10, Math.min(a.left, b.left, h.left) - gap) + sx;
      var xr = Math.min(docW - 10, Math.max(a.right, b.right, h.right) + gap) + sx;
      var y0 = a.top + a.height / 2 + sy;
      var y1 = b.top + b.height / 2 + sy;

      var aL = a.left + sx, bL = b.left + sx, aR = a.right + sx, bR = b.right + sx;
      var r = Math.max(0, Math.min(24, (y1 - y0) / 2, aL - xl, bL - xl, xr - aR, xr - bR));

      var dL = 'M' + aL + ',' + y0 +
               ' H' + (xl + r) + ' Q' + xl + ',' + y0 + ' ' + xl + ',' + (y0 + r) +
               ' V' + (y1 - r) + ' Q' + xl + ',' + y1 + ' ' + (xl + r) + ',' + y1 +
               ' H' + bL;
      var dR = 'M' + aR + ',' + y0 +
               ' H' + (xr - r) + ' Q' + xr + ',' + y0 + ' ' + xr + ',' + (y0 + r) +
               ' V' + (y1 - r) + ' Q' + xr + ',' + y1 + ' ' + (xr - r) + ',' + y1 +
               ' H' + bR;

      trackL.setAttribute('d', dL); liveL.setAttribute('d', dL);
      trackR.setAttribute('d', dR); liveR.setAttribute('d', dR);
    }

    function setProgress(p) {
      [[liveL, dotL], [liveR, dotR]].forEach(function (pair) {
        var path = pair[0], dot = pair[1];
        var len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len * (1 - p);
        var pt = path.getPointAtLength(len * p);
        dot.setAttribute('cx', pt.x);
        dot.setAttribute('cy', pt.y);
      });
    }

    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function hit() {
      finished = true;
      setProgress(1);
      wire.classList.add('done');
      btnBottom.classList.remove('hit');
      void btnBottom.offsetWidth;
      btnBottom.classList.add('hit');
      // auto-open band hai: sirf animation, Telegram user ke click pe hi khulega
    }

    function frame(ts) {
      if (cancelled) return;
      if (start === null) start = ts;
      var t = Math.min((ts - start) / DURATION, 1);
      setProgress(ease(t));
      if (t < 1) rafId = requestAnimationFrame(frame);
      else hit();
    }

    function stop() {
      cancelled = true;
      if (rafId) cancelAnimationFrame(rafId);
    }

    btnTop.addEventListener('click', stop);
    btnBottom.addEventListener('click', stop);

    window.addEventListener('resize', function () {
      build();
      if (finished) setProgress(1);
    });

    function go() {
      build();
      setProgress(0);
      btnTop.classList.add('send');
      rafId = requestAnimationFrame(frame);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(go);
    } else {
      window.addEventListener('load', go);
    }
  })();
</script>
